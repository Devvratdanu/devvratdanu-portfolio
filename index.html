<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{hero_title}}</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="nav-wrap">
  <div class="container nav-inner">
    <h1 class="logo">Portfolio DD</h1>
    <nav id="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#timeline">Timeline</a>
      <a href="#certs">Certificates</a>
      <a href="#projects">Projects</a>
      <a href="#testimonials">Testimonials</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>
    <button id="menuBtn" class="menu-btn">☰</button>
  </div>
</header>

<section id="home" class="hero">
  <div class="container hero-inner">
    <div>
      <h2 id="hero_title"></h2>
      <p id="hero_tagline"></p>
      <a class="btn" id="resume_link" download>Download Résumé</a>
    </div>
    <img id="profile_photo" class="profile-photo" />
  </div>
</section>

<section id="about" class="section">
  <div class="container">
    <h3>About Me</h3>
    <div id="about_content"></div>
  </div>
</section>

<section id="skills" class="section alt">
  <div class="container">
    <h3>Skills</h3>
    <div id="skills_list"></div>
  </div>
</section>

<section id="timeline" class="section">
  <div class="container">
    <h3>Experience & Education</h3>
    <div id="timeline_list"></div>
  </div>
</section>

<section id="certs" class="section alt">
  <div class="container">
    <h3>Certificates</h3>
    <div id="cert_list"></div>
  </div>
</section>

<section id="projects" class="section">
  <div class="container">
    <h3>Projects</h3>
    <div id="proj_list"></div>
  </div>
</section>

<section id="testimonials" class="section alt">
  <div class="container">
    <h3>Testimonials</h3>
    <div id="test_list"></div>
  </div>
</section>

<section id="blog" class="section">
  <div class="container">
    <h3>Blog</h3>
    <div id="blog_list"></div>
  </div>
</section>

<section id="contact" class="section alt">
  <div class="container">
    <h3>Contact Me</h3>
    <form action="https://formspree.io/f/mldrrvkv" method="POST" class="contact-form">
      <input name="name" placeholder="Your name" required>
      <input name="_replyto" type="email" placeholder="Your email" required>
      <textarea name="message" rows="5" placeholder="Message" required></textarea>
      <button class="btn" type="submit">Send</button>
    </form>
  </div>
</section>

<footer class="footer">
  <div class="container">© <span id="year"></span> Portfolio DD — All rights reserved</div>
</footer>

<script src="loader.js"></script>
<script src="script.js"></script>
</body>
</html>
