
backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  - name: "hero"
    label: "Homepage Hero"
    file: "content/hero.json"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tagline", name: "tagline", widget: "string"}
      - {label: "Profile Photo", name: "photo", widget: "image"}
      - {label: "Resume (PDF)", name: "resume", widget: "file"}

  - name: "about"
    label: "About Me"
    file: "content/about.json"
    fields:
      - {label: "Text", name: "text", widget: "text"}

  - name: "skills"
    label: "Skills"
    file: "content/skills.json"
    fields:
      - label: "Skills"
        name: "skills"
        widget: "list"
        fields:
          - {label: "Skill", name: "skill", widget: "string"}
          - {label: "Level (%)", name: "level", widget: "number"}
          - {label: "Icon", name: "icon", widget: "image"}

  - name: "timeline"
    label: "Experience & Education Timeline"
    file: "content/timeline.json"
    fields:
      - label: "Items"
        name: "timeline"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Place", name: "place", widget: "string"}
          - {label: "Year", name: "year", widget: "string"}

  - name: "certificates"
    label: "Certificates"
    file: "content/certificates.json"
    fields:
      - label: "Certificates"
        name: "certificates"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Issuer", name: "issuer", widget: "string"}
          - {label: "Date", name: "date", widget: "string"}
          - {label: "Certificate File", name: "file", widget: "file"}

  - name: "projects"
    label: "Projects"
    file: "content/projects.json"
    fields:
      - label: "Projects"
        name: "projects"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Excerpt", name: "excerpt", widget: "text"}

  - name: "testimonials"
    label: "Testimonials"
    file: "content/testimonials.json"
    fields:
      - label: "Testimonials"
        name: "testimonials"
        widget: "list"
        fields:
          - {label: "Quote", name: "quote", widget: "text"}
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Role", name: "role", widget: "string"}

  - name: "blog"
    label: "Blog Posts"
    file: "content/blog.json"
    fields:
      - label: "Posts"
        name: "blog"
        widget: "list"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Excerpt", name: "excerpt", widget: "text"}
