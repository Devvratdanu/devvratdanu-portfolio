backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "hero"
    label: "Hero Section"
    files:
      - file: "content/hero.json"
        label: "Hero Content"
        name: "hero"
        fields:
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Resume Button Text", name: "resume_text", widget: "string" }

  - name: "about"
    label: "About Me"
    files:
      - file: "content/about.json"
        label: "About Content"
        name: "about"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

  - name: "skills"
    label: "Skills"
    files:
      - file: "content/skills.json"
        label: "Skills List"
        name: "skills"
        fields:
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Level (%)", name: "level", widget: "number" }

  - name: "timeline"
    label: "Experience & Education"
    files:
      - file: "content/timeline.json"
        label: "Timeline Entries"
        name: "timeline"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "certificates"
    label: "Certificates"
    files:
      - file: "content/certificates.json"
        label: "Certificates List"
        name: "certificates"
        fields:
          - label: "Certificates"
            name: "certificates"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Issuer", name: "issuer", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }

  - name: "projects"
    label: "Projects"
    files:
      - file: "content/projects.json"
        label: "Projects List"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link", name: "link", widget: "string", required: false }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - file: "content/testimonials.json"
        label: "Testimonials List"
        name: "testimonials"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Message", name: "message", widget: "text" }

  - name: "blog"
    label: "Blog Posts"
    files:
      - file: "content/blog.json"
        label: "Blog List"
        name: "blog"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content", name: "content", widget: "markdown" }
              - { label: "Date", name: "date", widget: "datetime" }
